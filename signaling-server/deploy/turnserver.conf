# coturn configuration for Smart Parent (TURN fallback when phones can't connect directly,
# e.g. both on mobile data behind carrier-grade NAT, which is common on Indian mobile networks).
# Install: sudo apt install coturn ; copy to /etc/turnserver.conf ; enable TURNSERVER_ENABLED=1 in /etc/default/coturn
listening-port=3478
tls-listening-port=5349
fingerprint
# Same value as TURN_SECRET for the signaling server (long random string, never commit it)
use-auth-secret
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
realm=turn.your-domain.com
# Public IP of the VM (and private IP if behind NAT: external-ip=PUBLIC/PRIVATE)
external-ip=YOUR.PUBLIC.IP
total-quota=100
bps-capacity=0
stale-nonce=600
no-multicast-peers
no-cli
# Block relaying into private networks
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# TLS (recommended): certificates from Let's Encrypt
# cert=/etc/letsencrypt/live/turn.your-domain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.your-domain.com/privkey.pem
# Relay port range (open these in the firewall/NSG, UDP)
min-port=49160
max-port=49200
no-stdout-log
log-file=/var/log/turnserver.log
